name: build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pyinstaller
      - run: pyinstaller --noconsole --onefile --collect-all sounddevice --name MicStudio mic_studio.py
      - uses: actions/upload-artifact@v4
        with:
          name: MicStudio
          path: dist/MicStudio.exe

